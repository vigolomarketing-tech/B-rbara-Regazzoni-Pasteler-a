<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel del dueño (demo) | Bárbara Regazzoni</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
 body{padding:0 0 60px}
 .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
 .bar h1{font-family:var(--serif);font-size:20px;margin-right:auto}
 .bar a,.bar button{min-height:44px;padding:0 16px;border:1px solid rgba(251,248,243,.5);background:none;color:var(--paper);text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;font-size:14px}
 .demo{background:#fff3d6;border-bottom:1px solid #e9d49c;padding:12px 16px;font-size:15px}
 .wrap{max-width:860px;margin:0 auto;padding:20px 16px}
 h2.cat{font-size:26px;margin:32px 0 8px}
 .row{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:10px;display:grid;gap:10px}
 .row.off{opacity:.6}
 .top{display:flex;gap:12px;align-items:center}
 .ph{width:72px;height:72px;flex:none;background:var(--paper2);border:1px dashed #b9ad9b;display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center;cursor:pointer;overflow:hidden;position:relative}
 .ph img{width:100%;height:100%;object-fit:cover}
 .ph input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
 .prices{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
 .prices label{flex:1;min-width:110px}
 .sw{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:16px;font-weight:400;min-height:44px;flex-direction:row}
 .sw input{width:22px;height:22px;min-height:0;accent-color:var(--red)}
 .saved{color:#1d7a3a;font-size:14px;height:18px}
</style>
</head>
<body>
<div class="bar"><h1>Panel de Bárbara</h1><a href="index.html">Ver la web</a><button id="reset">Restaurar precios originales</button></div>
<p class="demo"><b>Demo:</b> acá Bárbara cambia precios, nombres, fotos y marca productos como agotados, y la web se actualiza al instante. En la versión final este panel tiene usuario y contraseña y guarda en una base de datos. En esta demo los cambios quedan solo en este navegador.</p>
<div class="wrap" id="root"></div>
<script src="data.js"></script>
<script>
(() => {
  const C = CONFIG, KEY = "regazzoni_demo_overrides";
  const fmt = n => "$ " + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  let ov = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ov)); } catch { alert("No hay lugar para guardar más fotos en este navegador."); } };
  const root = document.getElementById("root");

  function render() {
    root.innerHTML = C.categorias.map(cat => `<h2 class="cat">${esc(cat)}</h2>` + C.productos.filter(p => p.categoria === cat).map(p => {
      const o = ov[p.id] || {}, foto = o.foto || p.foto, off = o.disponible === false;
      return `<div class="row ${off ? "off" : ""}" data-id="${p.id}">
        <div class="top">
          <div class="ph">${foto ? `<img src="${esc(foto)}" alt="Foto de ${esc(p.nombre)}">` : "<span>Sumar foto</span>"}<input type="file" accept="image/*" data-f="foto" aria-label="Cambiar foto de ${esc(p.nombre)}"></div>
          <label style="flex:1">Nombre<input data-f="nombre" value="${esc(o.nombre || p.nombre)}"></label>
        </div>
        <div class="prices">${p.opciones.map((op, i) => `<label>Precio ${esc(op.etiqueta)}<input type="number" min="0" step="100" inputmode="numeric" data-f="precio" data-i="${i}" value="${o.precios && o.precios[i] != null ? o.precios[i] : op.precio}"></label>`).join("")}
          <label class="sw"><input type="checkbox" data-f="disp" ${off ? "" : "checked"}> Disponible</label></div>
        <div class="saved" aria-live="polite"></div>
      </div>`;
    }).join("")).join("");
  }

  function resize(file) {
    return new Promise(res => {
      const img = new Image(); img.onload = () => {
        const s = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/webp", .8));
      }; img.src = URL.createObjectURL(file);
    });
  }

  root.addEventListener("change", async e => {
    const t = e.target, row = t.closest(".row"); if (!row) return;
    const id = row.dataset.id, p = C.productos.find(x => x.id === id), o = ov[id] = ov[id] || {};
    const f = t.dataset.f;
    if (f === "nombre") o.nombre = t.value.trim() || p.nombre;
    if (f === "precio") { o.precios = o.precios || p.opciones.map(x => x.precio); o.precios[+t.dataset.i] = Math.max(0, +t.value || 0); }
    if (f === "disp") { o.disponible = t.checked; row.classList.toggle("off", !t.checked); }
    if (f === "foto" && t.files[0]) { o.foto = await resize(t.files[0]); const ph = row.querySelector(".ph"); let im = ph.querySelector("img"); if (!im) { ph.querySelector("span")?.remove(); im = new Image(); ph.prepend(im); } im.src = o.foto; im.alt = "Foto de " + p.nombre; }
    save();
    const s = row.querySelector(".saved"); s.textContent = "✓ Guardado — ya se ve en la web"; setTimeout(() => (s.textContent = ""), 2200);
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("¿Volver a los precios, nombres y fotos originales?")) { ov = {}; try { localStorage.removeItem(KEY); } catch {} render(); }
  });
  render();
})();
</script>
</body>
</html>
